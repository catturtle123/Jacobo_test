name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - develop

# WRITE 할 수 있는 권한을 부여합니다. (중요)
permissions: write-all

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name : Checkout
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name : Grant Execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

#      - name: Make application.yml
#        run: |
#          cd ./src/main/resources
#          touch ./application.yml
#          echo "${{ secrets.APPLICATION_YAML }}" | base64 --decode > ./application.yml
#        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean build
        shell: bash

      # 테스트커버리Report를 PR에 Comment에 등록합니다. (Instruction 기준)
      - name: Jacoco Report to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 100
          min-coverage-changed-files: 100
          title: "⭐️Code Coverage"
          update-comment: true